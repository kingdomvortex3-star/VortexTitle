plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'id.vortextitle'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    // Paper / Purpur API
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'

    // Optional PlaceholderAPI integration
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // SQLite bundled inside the final plugin JAR
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Keep the normal JAR separate from the shaded JAR.
tasks.named('jar') {
    archiveClassifier.set('plain')
}

// Build the final plugin JAR with SQLite included.
tasks.named('shadowJar') {
    archiveClassifier.set('')

    // Preserve JDBC service provider metadata.
    mergeServiceFiles()

    relocate(
        'org.sqlite',
        'id.vortextitle.libs.sqlite'
    )
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
